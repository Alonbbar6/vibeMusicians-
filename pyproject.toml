[project]
name = "vibemusicians"
version = "0.1.0"
description = "Autonomous agent pipeline that researches music trends, invents a virtual artist, writes and generates songs with Suno, and publishes them to SoundCloud."
requires-python = ">=3.11"
dependencies = [
    "anthropic>=0.69.0",
    "httpx>=0.27",
    "typer>=0.12",
    "pydantic>=2.7",
    "pydantic-settings>=2.4",
]

[project.scripts]
vibemusicians = "vibemusicians.cli:app"

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
