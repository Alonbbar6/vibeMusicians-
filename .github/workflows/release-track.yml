name: Release a new track

on:
  schedule:
    # Every day at 15:00 UTC. Adjust to taste. Each artist still caps at
    # WEEKLY_UPLOAD_LIMIT publishes per rolling 7-day window regardless of
    # how often this fires, so daily just means "check in daily," not
    # "publish daily."
    - cron: "0 15 * * *"
  workflow_dispatch:
    inputs:
      publish:
        description: "Publish to SoundCloud (uncheck for a dry run)"
        type: boolean
        default: true

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -e .

      - name: Run the agent pipeline
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          CLAUDE_MODEL: ${{ vars.CLAUDE_MODEL || 'claude-opus-4-8' }}
          SUNO_API_BASE_URL: ${{ vars.SUNO_API_BASE_URL || 'https://api.kie.ai' }}
          SUNO_API_KEY: ${{ secrets.SUNO_API_KEY }}
          SUNO_MODEL: ${{ vars.SUNO_MODEL || 'V4_5' }}
          SUNO_CALLBACK_URL: ${{ vars.SUNO_CALLBACK_URL || 'https://example.com/vibemusicians-callback' }}
          SOUNDCLOUD_CLIENT_ID: ${{ secrets.SOUNDCLOUD_CLIENT_ID }}
          SOUNDCLOUD_CLIENT_SECRET: ${{ secrets.SOUNDCLOUD_CLIENT_SECRET }}
          SOUNDCLOUD_REFRESH_TOKEN: ${{ secrets.SOUNDCLOUD_REFRESH_TOKEN }}
          WEEKLY_UPLOAD_LIMIT: ${{ vars.WEEKLY_UPLOAD_LIMIT || '15' }}
          MAX_ARTISTS: ${{ vars.MAX_ARTISTS || '3' }}
        # Typer/Click boolean options are --publish / --no-publish (no "=value" form),
        # so branch on the input instead of interpolating it into a single flag.
        run: |
          # Fresh CI checkouts start with an empty roster (data/ isn't
          # committed until the first successful run) — bootstrap one artist
          # so --count has something to round-robin across.
          vibemusicians artist ensure
          if [ "${{ github.event.inputs.publish }}" = "false" ]; then
            vibemusicians --verbose run --count 6 --no-publish
          else
            vibemusicians --verbose run --count 6 --publish
          fi

      # The persona/track database is regenerated fresh in CI unless you persist
      # it — commit `data/vibemusicians.db` back, or move it to an external
      # store, so the artist persona stays consistent across scheduled runs.
      - name: Persist persona/track database
        if: always()
        run: |
          if [ -f data/vibemusicians.db ]; then
            git config user.name "vibemusicians-bot"
            git config user.email "actions@users.noreply.github.com"
            git add -f data/vibemusicians.db
            git diff --cached --quiet || git commit -m "chore: update track database [skip ci]"
            git push
          else
            echo "No database file to persist (pipeline didn't get far enough to create one)."
          fi
