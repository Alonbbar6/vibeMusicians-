name: Release a new track

on:
  schedule:
    # Every 4 hours (6x/day), one song each — spread across the day instead
    # of one big batch, so a single failed run only costs 1 song instead of
    # the whole day's. Each artist still caps at WEEKLY_UPLOAD_LIMIT publishes
    # per rolling 7-day window regardless of how often this fires.
    - cron: "0 */4 * * *"
  workflow_dispatch:
    inputs:
      publish:
        description: "Publish to SoundCloud (uncheck for a dry run)"
        type: boolean
        default: true

# Never let two runs execute at the same time. The SoundCloud refresh token is
# single-use — SoundCloud invalidates it the instant it's spent — so if a
# manual run overlapped a scheduled one, both would start from the same token
# and the second would die with a 400 on oauth/token. Serializing runs removes
# that whole class of failure. cancel-in-progress: false lets an in-flight
# upload finish instead of being killed mid-run.
concurrency:
  group: release-track
  cancel-in-progress: false

permissions:
  contents: write # needed to commit data/vibemusicians.db back after each run

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -e .

      - name: Run the agent pipeline
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          CLAUDE_MODEL: ${{ vars.CLAUDE_MODEL || 'claude-opus-4-8' }}
          SUNO_API_BASE_URL: ${{ vars.SUNO_API_BASE_URL || 'https://api.kie.ai' }}
          SUNO_API_KEY: ${{ secrets.SUNO_API_KEY }}
          SUNO_MODEL: ${{ vars.SUNO_MODEL || 'V4_5' }}
          SUNO_CALLBACK_URL: ${{ vars.SUNO_CALLBACK_URL || 'https://example.com/vibemusicians-callback' }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_IMAGE_MODEL: ${{ vars.GEMINI_IMAGE_MODEL || 'gemini-2.5-flash-image' }}
          SOUNDCLOUD_CLIENT_ID: ${{ secrets.SOUNDCLOUD_CLIENT_ID }}
          SOUNDCLOUD_CLIENT_SECRET: ${{ secrets.SOUNDCLOUD_CLIENT_SECRET }}
          SOUNDCLOUD_REFRESH_TOKEN: ${{ secrets.SOUNDCLOUD_REFRESH_TOKEN }}
          WEEKLY_UPLOAD_LIMIT: ${{ vars.WEEKLY_UPLOAD_LIMIT || '15' }}
          MAX_ARTISTS: ${{ vars.MAX_ARTISTS || '3' }}
          TREND_CACHE_HOURS: ${{ vars.TREND_CACHE_HOURS || '24' }}
        # Typer/Click boolean options are --publish / --no-publish (no "=value" form),
        # so branch on the input instead of interpolating it into a single flag.
        run: |
          # Fresh CI checkouts start with an empty roster (data/ isn't
          # committed until the first successful run) — bootstrap one artist
          # so there's something to write a song for.
          vibemusicians artist ensure
          if [ "${{ github.event.inputs.publish }}" = "false" ]; then
            vibemusicians --verbose run --no-publish
          else
            vibemusicians --verbose run --publish
          fi

      # Persist state across runs. Two separate things get saved, two different
      # ways, and it runs even on failure so a token rotated mid-run is never lost.
      #
      #  1) The rotated SoundCloud refresh token -> saved into the repo SECRET
      #     SOUNDCLOUD_REFRESH_TOKEN (NOT committed to the repo). SoundCloud
      #     rotates this on every use, so the next run must read the newest one.
      #     Storing it as a secret keeps it private (even though the repo is
      #     public) and updates atomically, with no git race to lose it.
      #
      #  2) The track database -> committed back to the repo as before, but now
      #     with pull --rebase + retry so a push can never silently lose an update.
      - name: Persist rotated SoundCloud token and track database
        if: always()
        env:
          # A fine-grained PAT with this repo's "Secrets: Read and write"
          # permission. Stored as the repo secret SC_TOKEN_WRITE_PAT.
          # The built-in GITHUB_TOKEN cannot update secrets, so this is required.
          GH_TOKEN: ${{ secrets.SC_TOKEN_WRITE_PAT }}
        run: |
          # 1) Save the rotated SoundCloud refresh token into the repo secret.
          if [ -f data/soundcloud_refresh_token ]; then
            if [ -n "$GH_TOKEN" ]; then
              gh secret set SOUNDCLOUD_REFRESH_TOKEN --body "$(cat data/soundcloud_refresh_token)" \
                && echo "Updated SOUNDCLOUD_REFRESH_TOKEN secret with the rotated token." \
                || echo "WARNING: could not update the SOUNDCLOUD_REFRESH_TOKEN secret (check the SC_TOKEN_WRITE_PAT PAT)."
            else
              echo "WARNING: SC_TOKEN_WRITE_PAT is not set — the rotated token was NOT saved."
              echo "         Add that secret (see the apply guide) or the token will expire again."
            fi
            # Make sure the token file is never committed into the repo.
            rm -f data/soundcloud_refresh_token
          fi

          # 2) Commit the track database, pulling/rebasing first and retrying the
          #    push so a concurrent update can never make us silently lose state.
          git config user.name "vibemusicians-bot"
          git config user.email "actions@users.noreply.github.com"
          if [ -f data/vibemusicians.db ]; then
            git add -f data/vibemusicians.db
            if ! git diff --cached --quiet; then
              git commit -m "chore: update track database [skip ci]"
              pushed=""
              for attempt in 1 2 3 4 5; do
                if git pull --rebase --autostash && git push; then
                  pushed="yes"; break
                fi
                echo "push attempt $attempt failed; retrying in 3s..."
                sleep 3
              done
              [ -n "$pushed" ] || echo "WARNING: could not push the updated database after 5 attempts."
            else
              echo "Database unchanged — nothing to commit."
            fi
          fi
